<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2337">
<title>MinD Agent Office V3 — Pixel RPG</title>
<style>
:root{color-scheme:dark;--ink:#f8e9cf;--muted:#b9afad;--edge:#332a45;--accent:#e6bc78}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151a2c;color:var(--ink);font-family:ui-monospace,Consolas,"Courier New",monospace}
button,textarea{font:inherit}button{cursor:pointer}
#world{display:block;width:100vw;height:100dvh;image-rendering:pixelated;touch-action:none;outline:none}
#hud{position:fixed;top:max(15px,env(safe-area-inset-top));left:18px;pointer-events:none;display:flex;align-items:center;gap:12px;text-shadow:2px 2px #292234}
.logo{font-size:clamp(13px,1.7vw,21px);font-weight:900;letter-spacing:.1em;color:#fff5dd}.logo span{color:#f2ce83}
#hud small{font-size:10px;color:#e5d5ba;background:#2f2d48b3;padding:6px 9px;border:2px solid #675877}
#hint{position:fixed;bottom:max(15px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100vw - 20px);color:#fff1ce;background:#25243ddb;border:2px solid #645373;box-shadow:0 5px 0 #141527;padding:8px 13px;font-size:11px;pointer-events:none;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#notice{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:#35344e;border:2px solid #c9a26b;box-shadow:0 5px 0 #141627;padding:11px 15px;font-size:12px;max-width:92vw;display:none;z-index:7}
#notice.show{display:block}
#shade{position:fixed;inset:0;background:#0e1025a8;display:none;z-index:10;align-items:flex-end;justify-content:center;padding:20px}
#shade.open{display:flex}
.dialog{width:min(640px,100%);max-height:min(83dvh,800px);overflow-y:auto;background:#2d2942;border:4px solid #806985;outline:4px solid #17182a;box-shadow:0 14px 0 #0b0f1b;padding:23px;position:relative}
.dialog h2{font-size:19px;margin:0 40px 6px 0;color:#fff3cf}.dialog h3{font-size:13px;margin:20px 0 8px;color:#ffd48b}.dialog p,.dialog li{font-size:12px;line-height:1.75;color:#dbd0ce}.dialog .sub{font-size:11px;color:#adcccd;margin-bottom:18px}
.close{position:absolute;right:14px;top:12px;width:32px;height:32px;background:#563a57;border:2px solid #ac8290;color:white}
.skill-list{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#3f405f;border:1px solid #6d6e8e;padding:7px 9px;font-size:11px;color:#e9e2fc}
button.action{background:#7b6ea5;border:2px solid #c7b4d2;color:#fff8e5;padding:10px 12px;margin:6px 6px 6px 0;box-shadow:0 3px 0 #171728;font-size:12px}
button.action.primary{background:#638d87;border-color:#aed4bb}button.action:hover{filter:brightness(1.15)}
textarea{width:100%;min-height:122px;resize:vertical;color:#fff4d9;background:#1c2036;border:2px solid #6b6487;padding:12px;line-height:1.5;font-size:12px}
.mission{border:2px solid #595273;background:#22263b;padding:12px;margin:11px 0}.mission strong{font-size:12px}.mission small{color:#c0bbce;font-size:10px}.mission p{margin:7px 0}
.step{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed #67607b}.step .meta{font-size:10px;color:#abb5ce;margin-top:4px}.step button{white-space:nowrap}
.note{background:#3d3449;padding:11px;border-left:3px solid #e7bc77;font-size:11px;line-height:1.7;color:#e9dbc8}
label{font-size:12px}
@media(max-width:650px){#hud{left:10px;top:10px;display:block}.logo{font-size:13px}#hud small{display:block;margin-top:6px;font-size:9px}#hint{font-size:9px}.dialog{padding:14px;max-height:88dvh}.dialog h2{font-size:15px}#shade{padding:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="Bản đồ văn phòng pixel tương tác; chạm hoặc click một nhân vật để xem nhiệm vụ"></canvas>
<div id="hud"><div class="logo">MinD<span>✦</span> AGENT OFFICE <span>V3</span></div><small>PIXEL RPG · 7 AGENTS · NO API</small></div>
<div id="hint">Click nhân vật để xem skills · Click bảng MISSION để giao việc · Kéo để quan sát văn phòng</div>
<div id="notice" role="status" aria-live="polite"></div>
<div id="shade" aria-hidden="true"><section class="dialog" role="dialog" aria-modal="true" aria-label="Agent Office" id="dialog"><button class="close" id="close" aria-label="Đóng">×</button><div id="dialog-body"></div></section></div>
<script type="module">
import {CREW,getCrew} from './src/crew-v3.mjs';
import {createMission,readyStages,completeStage,buildWorkPrompt,loadState,saveState,getMissionStats} from './src/mission-v3.mjs';

const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d',{alpha:false}),shade=document.querySelector('#shade'),body=document.querySelector('#dialog-body');
let store;try{store=localStorage}catch{store=null}
let state=loadState(store),clock=0,last=0,camera={x:0,y:0,scale:1},drag=null,hover=null,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const WORLD={w:1280,h:800};let currentDialog=null;
const people=CREW.map((a,i)=>({a,x:a.home.x,y:a.home.y,tx:a.home.x,ty:a.home.y,walk:0,direction:1,phase:i*1.75,rest:i*1.6}));
const color=(c)=>{ctx.fillStyle=c}, rect=(x,y,w,h,c)=>{color(c);ctx.fillRect(Math.round(x/2)*2,Math.round(y/2)*2,Math.round(w/2)*2,Math.round(h/2)*2)};
const stroke=(x,y,w,h,c,line=4)=>{rect(x,y,w,line,c);rect(x,y+h-line,w,line,c);rect(x,y,line,h,c);rect(x+w-line,y,line,h,c)};
const label=(s,x,y,size=12,c='#f7e6c1',align='left')=>{ctx.fillStyle=c;ctx.font='bold '+size+'px monospace';ctx.textAlign=align;ctx.fillText(s,x,y);ctx.textAlign='left'};
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&#39;'}[ch]));
const personColor=id=>getCrew(id)?.color||'#aaa';
function floor(){
  rect(0,0,WORLD.w,WORLD.h,'#242a3b');
  rect(0,82,1280,718,'#635567');
  for(let y=84;y<800;y+=40)for(let x=0;x<1280;x+=40){
    rect(x,y,38,38,(Math.floor(x/40)+Math.floor(y/40))%2?'#615565':'#675a69');
    rect(x+3,y+3,3,3,'#706478');
  }
  rect(0,0,1280,90,'#30374e');rect(0,72,1280,16,'#ab8b81');rect(0,85,1280,8,'#493949');
  for(const x of [78,371,665,958]){
    rect(x,8,208,56,'#344a68');stroke(x,8,208,56,'#bc9ea2',7);
    rect(x+92,8,6,56,'#b8b4bd');rect(x,33,208,5,'#b8b4bd');
    rect(x+14,14,52,16,'#6d91a5');rect(x+143,43,48,12,'#779bb2');
  }
  // pixel rugs: paths center on both office rows
  rect(26,173,1225,510,'#554e63');rect(38,186,1202,485,'#6d5a6e');
  for(let x=40;x<1240;x+=28){rect(x,186,12,4,'#ae8b82');rect(x,668,12,4,'#ae8b82')}
  rect(38,387,1202,66,'#7c6171');
  for(let x=50;x<1230;x+=44)rect(x,414,20,5,'#9a7480');
  // room separators and plants
  for(const x of [400,830]){rect(x,103,9,247,'#453c57');rect(x+4,103,5,30,'#96768d');rect(x,477,9,221,'#453c57')}
  for(const x of [28,1252])for(const y of [140,473])plant(x,y);
  label('MIN D STUDIO  /  YOUR LITTLE AI OFFICE',640,118,14,'#ebd8ba','center');
}
function plant(x,y){
 rect(x-17,y+18,34,25,'#b47768');stroke(x-17,y+18,34,25,'#6a4c5b',4);
 for(const [dx,dy] of [[-15,2],[14,0],[-9,-16],[8,-20],[0,-29]])rect(x+dx-8,y+dy-5,19,22,'#5e9b83');
 for(const [dx,dy] of [[-10,-8],[8,-12],[0,-24]])rect(x+dx-6,y+dy-4,14,15,'#8ac89b');
}
function monitor(x,y,c='#8fd3e0'){
 rect(x,y,75,44,'#2c2b43');stroke(x,y,75,44,'#252338',5);rect(x+7,y+7,61,30,'#405a6c');
 rect(x+14,y+15,21,4,c);rect(x+14,y+24,34,3,'#aac2cc');rect(x+51,y+15,9,16,'#577d9b');
 rect(x+32,y+44,12,7,'#3a344b');rect(x+19,y+51,38,5,'#3a344b');
}
function desk(a){
 const {x,y}=a.station,lower=y>400;
 // shadow, chair, desk, decorative details
 rect(x-108,y+39,226,9,'#362e49');
 rect(x-91,y-45,185,101,'#5a3d4a');rect(x-86,y-51,185,96,'#aa7967');stroke(x-86,y-51,185,96,'#49384d',7);
 rect(x-70,y-37,153,58,'#c49b7a');rect(x-62,y-32,32,6,'#e8be91');
 monitor(x-31,y-40,a.color);
 rect(x+57,y-32,18,24,'#e4d6ba');rect(x+59,y-30,14,3,a.color);
 rect(x-16,y+24,66,12,'#655565');rect(x-3,y+33,44,8,'#45405c');
 rect(x-38,y+49,73,51,'#45415b');rect(x-31,y+55,59,39,'#77738c');
 stroke(x-38,y+49,73,51,'#2b2d41',5);
 label(a.name.toUpperCase(),x+8,y-63,15,'#fff2cf','center');
 label(a.team.toUpperCase(),x+8,y+120,11,'#f5e0c7','center');
 if(lower){rect(x-105,y+146,210,5,'#a17878')}
}
function missionBoard(){
 rect(479,110,316,78,'#3b344b');stroke(479,110,316,78,'#d2a17b',7);
 rect(491,121,292,55,'#263e4b');label('✦ MISSION BOARD ✦',637,144,19,'#f6d692','center');
 label('CLICK TO ASSIGN / REVIEW',637,166,11,'#bbd1cf','center');
 rect(497,185,10,10,'#dbac79');rect(763,185,10,10,'#dbac79');
}
function lamp(x,y){rect(x-16,y-15,32,12,'#edc47e');rect(x-24,y-4,48,8,'#aa806d');rect(x-9,y-31,18,18,'#faf0b8');rect(x-7,y-30,14,9,'#fff4d4')}
function worldScene(){
 floor();
 rect(50,125,335,238,'#5b4d64');stroke(50,125,335,238,'#8e7181',6);
 rect(423,125,382,238,'#555567');stroke(423,125,382,238,'#a18394',6);
 rect(845,125,381,238,'#595268');stroke(845,125,381,238,'#987f8e',6);
 rect(51,466,348,253,'#5e596c');stroke(51,466,348,253,'#977887',6);
 rect(421,466,400,253,'#57526c');stroke(421,466,400,253,'#977887',6);
 rect(839,466,384,253,'#5e5467');stroke(839,466,384,253,'#977887',6);
 // pinboards and room labels
 const rooms=[['STRATEGY',217,170],['EVIDENCE LAB',489,170],['CONTENT + MEDIA',1032,170],['QUALITY LAB',272,510],['ENGINEERING',627,510],['REPORT ARCHIVE',993,510]];
 for(const [s,x,y] of rooms){rect(x-89,y-15,180,24,'#302f48');label(s,x,y+1,12,'#e3bb91','center')}
 rect(60,732,1160,48,'#3c374f');label('AGENT OFFICE  ·  CLICK CHARACTER / BOARD  ·  NO API / NO FAKE AI',640,761,13,'#dac9aa','center');
 missionBoard();
 for(const a of CREW)desk(a);
 lamp(408,416);lamp(832,416);
 for(const p of people)drawPerson(p);
}
function drawPerson(p){
 let {x,y,a}=p;
 const moving=Math.abs(p.tx-x)+Math.abs(p.ty-y)>2;
 const bob=moving?Math.sin(p.walk*12)*3:Math.sin(clock*1.3+p.phase)*1.2;
 x=Math.round(x/2)*2;y=Math.round((y+bob)/2)*2;
 // shadow
 rect(x-21,y+27,44,8,'#33283d');
 const step=moving?Math.sin(p.walk*12)*6:0;
 rect(x-18,y+14,15,16+step,'#413647');rect(x+4,y+14,15,16-step,'#413647');
 rect(x-19,y+27+step,16,8,'#2b2b44');rect(x+5,y+27-step,16,8,'#2b2b44');
 rect(x-25,y-19,50,44,a.color);rect(x-20,y-13,40,29,'#e9d9d8');
 rect(x-31,y-13,11,27,a.color);rect(x+20,y-13,11,27,a.color);
 rect(x-11,y-42,23,24,a.skin);rect(x-24,y-80,49,51,a.hair);
 rect(x-28,y-65,56,38,a.skin);
 rect(x-28,y-84,56,25,a.hair);rect(x-28,y-66,13,21,a.hair);rect(x+18,y-65,10,17,a.hair);
 rect(x-14,y-51,7,8,'#2e344d');rect(x+9,y-51,7,8,'#2e344d');rect(x-4,y-39,11,3,'#d98083');
 rect(x-17,y-38,9,4,'#eda2a4');rect(x+11,y-38,9,4,'#eda2a4');
 if(a.accessory==='glasses'){rect(x-19,y-56,17,14,'#38374e');rect(x+3,y-56,17,14,'#38374e');rect(x-16,y-53,11,8,'#d6e6da');rect(x+6,y-53,11,8,'#d6e6da');rect(x-2,y-53,6,3,'#38374e')}
 if(a.accessory==='crown'){rect(x-18,y-88,36,9,'#ead18e');rect(x-16,y-97,7,10,'#ead18e');rect(x-1,y-101,7,14,'#ead18e');rect(x+12,y-96,6,10,'#ead18e')}
 if(a.accessory==='beret'){rect(x-31,y-88,54,12,'#b35386');rect(x-16,y-97,34,13,'#c86d91')}
 if(a.accessory==='headphones'||a.accessory==='headset'){rect(x-31,y-67,9,28,'#3c3e5e');rect(x+24,y-67,9,28,'#3c3e5e');rect(x-19,y-90,37,8,'#4f536f')}
 if(a.accessory==='clipboard'){rect(x+19,y-10,19,23,'#e5d7c3');rect(x+24,y-7,12,3,'#7cb9a2')}
 const mission=state.missions.find(m=>m.stages.some(s=>s.agentId===a.id && readyStages(m).some(r=>r.id===s.id)));
 if(mission){rect(x+19,y-107,13,13,'#ffdf8a');label('!',x+25,y-96,12,'#3a2e49','center')}
 const isHover=hover===a.id;
 if(isHover){stroke(x-40,y-116,80,153,'#f5d795',3);label(a.name,x,y-121,15,'#fff8db','center')}
}
function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);
 const minScale=Math.min(innerWidth/1280,innerHeight/800);
 camera.scale=Math.max(minScale,Math.min(1.5,innerHeight/780));
 if(innerWidth<700)camera.scale=Math.max(.72,innerHeight/820);
 camera.x=(innerWidth-1280*camera.scale)/2;camera.y=(innerHeight-800*camera.scale)/2;
}
window.addEventListener('resize',resize);resize();
function toWorld(clientX,clientY){return {x:(clientX-camera.x)/camera.scale,y:(clientY-camera.y)/camera.scale}}
function hit(x,y){
 if(x>475&&x<805&&y>106&&y<201)return {type:'mission'};
 for(let i=people.length-1;i>=0;i--){const p=people[i];if(Math.abs(x-p.x)<49&&y>p.y-116&&y<p.y+52)return {type:'agent',id:p.a.id}}
 return null;
}
function target(p,x,y){p.tx=Math.max(65,Math.min(1210,x));p.ty=Math.max(205,Math.min(704,y))}
function tick(t){
 const dt=Math.min(.05,(t-last)/1000||.016);last=t;if(!paused)clock+=dt;
 for(const p of people){
  if(!paused){
   const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
   if(d>3){const step=Math.min(d,dt*70);p.x+=dx/d*step;p.y+=dy/d*step;p.walk+=dt;p.direction=dx>=0?1:-1;}
   else{p.rest+=dt;if(p.rest>7+(p.phase%5)){p.rest=0;const active=state.missions.some(m=>readyStages(m).some(s=>s.agentId===p.a.id));target(p,active?p.a.walkTo.x:p.a.home.x+(Math.sin(clock+p.phase)*35),active?p.a.walkTo.y:p.a.home.y+(Math.cos(clock*.8+p.phase)*12));}}
  }
 }
 ctx.setTransform(1,0,0,1,0,0);rect(0,0,canvas.width,canvas.height,'#151a2c');
 const dpr=canvas.width/innerWidth;ctx.setTransform(dpr*camera.scale,0,0,dpr*camera.scale,dpr*camera.x,dpr*camera.y);
 ctx.imageSmoothingEnabled=false;worldScene();requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
function toast(text){const n=document.querySelector('#notice');n.textContent=text;n.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.remove('show'),3400)}
function show(html,kind='panel'){body.innerHTML=html;shade.classList.add('open');shade.setAttribute('aria-hidden','false');currentDialog=kind;document.querySelector('#close').focus()}
function hide(){shade.classList.remove('open');shade.setAttribute('aria-hidden','true');currentDialog=null;canvas.focus()}
document.querySelector('#close').onclick=hide;
shade.addEventListener('click',e=>{if(e.target===shade)hide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
const chip=a=>'<span class="chip">'+esc(a)+'</span>';
function showAgent(id){
 const a=getCrew(id);if(!a)return;
 const jobs=state.missions.flatMap(m=>m.stages.filter(s=>s.agentId===a.id).map(s=>({m,s})));
 const next=jobs.find(({m,s})=>readyStages(m).some(x=>x.id===s.id));
 const html='<h2>'+esc(a.name)+' — '+esc(a.team)+'</h2><div class="sub">'+esc(a.title)+'</div><p>'+esc(a.mission)+'</p><h3>SKILLS / CAPABILITIES</h3><div class="skill-list">'+a.skills.map(chip).join('')+'</div><h3>OUTPUT CONTRACT</h3><p>'+esc(a.output)+'</p><div class="note">'+esc(a.restrictions)+'</div><h3>MISSION ASSIGNMENTS</h3><p>'+jobs.length+' stage · '+jobs.filter(j=>j.s.status==='done').length+' có kết quả thực.</p>'+
 (next?'<div class="mission"><strong>'+esc(next.m.brief.slice(0,160))+'</strong><p>'+esc(next.s.title)+'</p><button class="action primary" data-cmd="stage" data-mid="'+esc(next.m.id)+'" data-sid="'+esc(next.s.id)+'">Mở nhiệm vụ sẵn sàng</button></div>':'<div class="note">Chưa có nhiệm vụ sẵn sàng. Click bảng MISSION trong văn phòng để giao việc.</div>')+
 '<button class="action" data-cmd="board">Xem Mission Board</button>';
 target(people.find(p=>p.a.id===id),a.walkTo.x,a.walkTo.y);
 show(html,'agent');
}
function renderBoard(){
 const list=state.missions.slice().reverse();
 show('<h2>✦ MISSION BOARD</h2><div class="sub">Mọi công việc đều hiển thị ngay trong thế giới RPG. Chế độ NO API · Work handoff.</div><div class="note">Website không thể tự trừ credit ChatGPT hoặc gọi model của tài khoản. Bạn có thể copy prompt vào ChatGPT Work rồi dán kết quả thực trở lại.</div><h3>GIAO NHIỆM VỤ MỚI</h3><textarea id="brief" maxlength="4000" placeholder="Ví dụ: Viết kịch bản và tạo thumbnail TikTok về BOS/CHoCH, có nghiên cứu và QC..."></textarea><button class="action primary" data-cmd="create">Tạo mission & phân team</button><h3>MISSION HISTORY ('+list.length+')</h3>'+
 (list.map(m=>{const q=getMissionStats(m);return '<div class="mission"><strong>'+esc(m.brief.slice(0,160))+'</strong><p>'+q.done+'/'+q.total+' stages · '+q.percent+'% có kết quả thật</p><small>'+new Date(m.createdAt).toLocaleString('vi-VN')+'</small><div><button class="action" data-cmd="mission" data-mid="'+esc(m.id)+'">Mở nhiệm vụ</button></div></div>'}).join('')||'<p>Chưa có mission. Nhập brief để Nova phân công.</p>'), 'board');
}
function renderMission(id){
 const m=state.missions.find(x=>x.id===id);if(!m)return renderBoard();
 const q=getMissionStats(m);
 show('<h2>MISSION · '+q.percent+'% Verified</h2><p>'+esc(m.brief)+'</p><div class="note">Trạng thái DONE chỉ được tạo khi có kết quả thực được đưa về. Agent đi lại trên map là animation của game, không phải dấu hiệu model đang chạy.</div><h3>WORKFLOW / HANDOFF</h3>'+
 m.stages.map(s=>{
 const a=getCrew(s.agentId),ready=readyStages(m).some(p=>p.id===s.id);
 const status=s.status==='done'?'✓ Đã lưu kết quả':ready?'● Có thể thực hiện':'○ Chờ đầu vào';
 return '<div class="step"><div><strong style="color:'+a.color+'">'+esc(a.name)+'</strong> · '+esc(s.title)+'<div class="meta">'+status+'</div></div>'+(ready?'<button class="action" data-cmd="stage" data-mid="'+esc(m.id)+'" data-sid="'+esc(s.id)+'">Giao việc</button>':s.status==='done'?'<button class="action" data-cmd="result" data-mid="'+esc(m.id)+'" data-sid="'+esc(s.id)+'">Kết quả</button>':'')+'</div>'
 }).join('')+'<button class="action" data-cmd="board">← Mission Board</button>','mission');
}
function renderStage(mid,sid){
 const m=state.missions.find(x=>x.id===mid),s=m?.stages.find(x=>x.id===sid);if(!s)return;
 const a=getCrew(s.agentId),prompt=buildWorkPrompt(m,sid);
 show('<h2>'+esc(a.name)+' · '+esc(s.title)+'</h2><p>'+esc(a.mission)+'</p><h3>CHATGPT WORK HANDOFF</h3><p>Copy prompt vào cuộc hội thoại ChatGPT Work của bạn. Sau khi model trả kết quả, dán nguyên phần deliverable vào bên dưới để mở khóa bước tiếp theo.</p><button class="action primary" data-cmd="copy" data-mid="'+esc(mid)+'" data-sid="'+esc(sid)+'">Copy prompt cho ChatGPT Work</button><button class="action" data-cmd="open-work">Mở ChatGPT</button><h3>GHI NHẬN OUTPUT THỰC</h3><textarea id="stage-result" maxlength="40000" placeholder="Dán output được tạo và kiểm chứng từ ChatGPT Work tại đây..."></textarea><button class="action primary" data-cmd="complete" data-mid="'+esc(mid)+'" data-sid="'+esc(sid)+'">Lưu kết quả · Mở khóa bước tiếp</button><button class="action" data-cmd="mission" data-mid="'+esc(mid)+'">← Mission</button>','stage');
}
function renderResult(mid,sid){const m=state.missions.find(x=>x.id===mid),s=m?.stages.find(x=>x.id===sid);if(!s)return;show('<h2>'+esc(getCrew(s.agentId).name)+' · Kết quả đã ghi nhận</h2><div class="note">'+esc(s.title)+'</div><p style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(s.result)+'</p><button class="action" data-cmd="mission" data-mid="'+esc(mid)+'">← Mission</button>')}
body.addEventListener('click',async e=>{
 const b=e.target.closest('[data-cmd]');if(!b)return;const {cmd,mid,sid}=b.dataset;
 if(cmd==='board')return renderBoard();
 if(cmd==='mission')return renderMission(mid);
 if(cmd==='stage')return renderStage(mid,sid);
 if(cmd==='result')return renderResult(mid,sid);
 if(cmd==='open-work'){window.open('https://chatgpt.com/','_blank','noopener,noreferrer');return}
 if(cmd==='create'){try{const m=createMission(document.querySelector('#brief').value);state={...state,missions:[m,...state.missions].slice(0,100)};if(!saveState(store,state))toast('Không lưu được localStorage: dữ liệu chỉ có trong phiên này.');target(people[0],CREW[0].walkTo.x,CREW[0].walkTo.y);renderMission(m.id)}catch(err){toast(err.message)}return}
 if(cmd==='copy'){
  const m=state.missions.find(x=>x.id===mid),text=buildWorkPrompt(m,sid);
  try{await navigator.clipboard.writeText(text);toast('Đã copy prompt. Dán vào ChatGPT Work.')}catch{const field=document.createElement('textarea');field.value=text;body.appendChild(field);field.select();toast('Clipboard không khả dụng; hãy copy văn bản vừa hiển thị.')}
  return;
 }
 if(cmd==='complete'){
  const text=document.querySelector('#stage-result')?.value||'';
  try{state={...state,missions:state.missions.map(m=>m.id===mid?completeStage(m,sid,text):m)};if(!saveState(store,state))toast('Lưu trữ bị chặn.');toast('Đã lưu kết quả; stage tiếp theo đã mở khóa.');renderMission(mid)}catch(err){toast(err.message)}
 }
});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox:camera.x,oy:camera.y,moved:false}});
canvas.addEventListener('pointermove',e=>{
 const p=toWorld(e.clientX,e.clientY);hover=hit(p.x,p.y)?.id||null;
 canvas.style.cursor=hover?'pointer':'grab';
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>7)drag.moved=true;if(drag.moved){camera.x=drag.ox+dx;camera.y=drag.oy+dy;}}
});
canvas.addEventListener('pointerup',e=>{
 if(!drag)return;const didDrag=drag.moved;drag=null;if(didDrag)return;
 const p=toWorld(e.clientX,e.clientY),h=hit(p.x,p.y);
 if(h?.type==='agent')showAgent(h.id);
 if(h?.type==='mission')renderBoard();
});
canvas.addEventListener('wheel',e=>{
 e.preventDefault();const p=toWorld(e.clientX,e.clientY),delta=e.deltaY<0?1.08:.92;camera.scale=Math.max(.55,Math.min(2,camera.scale*delta));camera.x=e.clientX-p.x*camera.scale;camera.y=e.clientY-p.y*camera.scale
},{passive:false});
</script>
</body>
</html>
